<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1f1a" />
    <title>山頂滑雪</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/ski/ski.css" />
  </head>
  <body class="in-menu">
    <div id="app">
      <canvas id="game"></canvas>
      <div id="touch-area"></div>
      <div id="top">
        <button id="btn-menu" class="btn" aria-label="選單">☰</button>
        <div id="time">0:00.0</div>
        <div id="best"></div>
      </div>
      <div id="progress"><div id="progress-fill"></div></div>
      <div id="speed"><b>0</b><small>km/h</small></div>
      <div id="trick"></div>
      <div id="hint"></div>
      <div id="stick"><div id="stick-knob"></div><span class="lbl up">壓板頭</span><span class="lbl down">重心後</span></div>
      <button id="btn-turn" class="btn round" aria-label="轉向">轉向</button>
      <button id="btn-jump" class="btn round big" aria-label="跳">跳</button>
      <div id="menu" class="overlay show">
        <h1>山頂滑雪</h1>
        <p class="sub">從山頂一路滑到山腳：陡峭雪溝、開闊雪坡、樹林和跳台</p>
        <button class="btn wide" id="btn-start">出發</button>
        <div class="help">
          <p><b>左手搖桿＝身體重心</b>　往前壓板頭加速・往後坐重心減速・左右壓刃轉彎（刻滑，幾乎不掉速）</p>
          <p><b>按住「轉向」</b>＋左右：把板打橫甩向那一邊，急轉但會掉速、噴雪　＋往後：板子完全打橫煞車</p>
          <p><b>「跳」</b>按住蹲低蓄力、放開起跳。空中按住「轉向」＋左右可以轉體 180／360</p>
          <p><b>電腦</b>　WASD／方向鍵＝搖桿・Shift＝轉向・空白鍵＝跳</p>
          <p>落地時板子要順著前進方向，太橫或摔太重會跌倒；撞到樹或石頭也會。</p>
        </div>
      </div>
      <div id="result" class="overlay">
        <h1 id="result-title">完成！</h1>
        <div id="result-time"></div>
        <div id="result-best"></div>
        <button class="btn wide" id="btn-again">再滑一次</button>
        <button class="btn wide" id="btn-back">回選單</button>
      </div>
    </div>
    <script type="module" src="/src/ski/main.ts"></script>
  </body>
</html>
